services:
  postgres:
    image: postgres:16-alpine
    container_name: pp-planning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pp_planning
      POSTGRES_PASSWORD: pp_planning_dev
      POSTGRES_DB: pp_planning
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pp_planning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pp_planning -d pp_planning']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pp-planning-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - pp_planning_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: pp-planning-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/pp-planning;
      mc anonymous set none local/pp-planning;
      exit 0;
      "

volumes:
  pp_planning_postgres_data:
  pp_planning_minio_data:
